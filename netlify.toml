[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "better-sqlite3"]
  included_files = ["views/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/site/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/site/:splat"
  status = 200
