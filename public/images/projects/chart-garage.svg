<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' class='chart-svg'>
  <defs>
    <linearGradient id='garLine' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#608D9A'/>
      <stop offset='50%' stop-color='#015112'/>
      <stop offset='100%' stop-color='#10b981'/>
    </linearGradient>
    <linearGradient id='garArea' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#608D9A' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#015112' stop-opacity='0.02'/>
    </linearGradient>
  </defs>

  <rect x='10' y='10' width='580' height='300' rx='16' fill='#ffffff' stroke='rgba(156,114,33,0.18)' stroke-width='1'/>

  <text x='35' y='42' font-family='Plus Jakarta Sans, sans-serif' font-size='13' font-weight='800' fill='#015112' letter-spacing='0.5'>CONSULTATION BOOKING &amp; SHOW RATE</text>
  <text x='35' y='60' font-family='Outfit, sans-serif' font-size='12' fill='#64748b'>Rochester &amp; Syracuse Regional Garage Transformation</text>

  <rect x='415' y='28' width='150' height='28' rx='14' fill='#015112'/>
  <text x='490' y='46' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='700' fill='#ffffff' text-anchor='middle'>68% Close Rate</text>

  <!-- Metrics row -->
  <rect x='35' y='82' width='165' height='60' rx='10' fill='#f8fafc' stroke='#e2e8f0'/>
  <text x='50' y='108' font-family='Plus Jakarta Sans, sans-serif' font-size='18' font-weight='800' fill='#015112'>82 Leads</text>
  <text x='50' y='126' font-family='Outfit, sans-serif' font-size='11' fill='#64748b'>Inbound Local Inquiries</text>

  <rect x='215' y='82' width='165' height='60' rx='10' fill='#f8fafc' stroke='#e2e8f0'/>
  <text x='230' y='108' font-family='Plus Jakarta Sans, sans-serif' font-size='18' font-weight='800' fill='#059669'>40 CAC</text>
  <text x='230' y='126' font-family='Outfit, sans-serif' font-size='11' fill='#64748b'>Customer Acquisition Cost</text>

  <rect x='395' y='82' width='165' height='60' rx='10' fill='#f8fafc' stroke='#e2e8f0'/>
  <text x='410' y='108' font-family='Plus Jakarta Sans, sans-serif' font-size='18' font-weight='800' fill='#9C7221'>3 Counties</text>
  <text x='410' y='126' font-family='Outfit, sans-serif' font-size='11' fill='#64748b'>Exclusive Territory Reach</text>

  <!-- Progress Track -->
  <line x1='35' y1='235' x2='565' y2='235' stroke='#e2e8f0' stroke-width='1.5'/>
  <path d='M45,225 C120,215 180,190 260,175 C340,160 420,150 535,135' fill='none' stroke='url(#garLine)' stroke-width='4' stroke-linecap='round'/>
  <path d='M45,225 C120,215 180,190 260,175 C340,160 420,150 535,135 L535,235 L45,235 Z' fill='url(#garArea)'/>

  <circle cx='45' cy='225' r='5' fill='#ffffff' stroke='#608D9A' stroke-width='3'/>
  <circle cx='260' cy='175' r='5' fill='#ffffff' stroke='#015112' stroke-width='3'/>
  <circle cx='535' cy='135' r='6' fill='#10b981' stroke='#ffffff' stroke-width='3'/>

  <text x='45' y='265' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='600' fill='#64748b' text-anchor='middle'>Week 2</text>
  <text x='260' y='265' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='600' fill='#64748b' text-anchor='middle'>Week 6</text>
  <text x='535' y='265' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='800' fill='#015112' text-anchor='middle'>Week 12 (Scale)</text>
