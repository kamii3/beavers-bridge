<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' class='chart-svg'>
  <defs>
    <linearGradient id='roofGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#10b981' stop-opacity='0.45'/>
      <stop offset='100%' stop-color='#10b981' stop-opacity='0.02'/>
    </linearGradient>
    <linearGradient id='roofLine' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#059669'/>
      <stop offset='60%' stop-color='#10b981'/>
      <stop offset='100%' stop-color='#34d399'/>
    </linearGradient>
    <filter id='roofGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='#10b981' flood-opacity='0.35'/>
    </filter>
  </defs>

  <!-- Background Card Grid -->
  <rect x='10' y='10' width='580' height='300' rx='16' fill='#ffffff' stroke='rgba(156,114,33,0.18)' stroke-width='1'/>

  <!-- Chart Header -->
  <text x='35' y='42' font-family='Plus Jakarta Sans, sans-serif' font-size='13' font-weight='800' fill='#015112' letter-spacing='0.5'>VERIFIED LEAD VOLUME GROWTH</text>
  <text x='35' y='60' font-family='Outfit, sans-serif' font-size='12' fill='#64748b'>Philly Suburban Storm &amp; Replacement Inquiries</text>

  <!-- Top Pill -->
  <rect x='425' y='28' width='140' height='28' rx='14' fill='#015112'/>
  <circle cx='440' cy='42' r='4' fill='#10b981'/>
  <text x='488' y='46' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='700' fill='#ffffff' text-anchor='middle'>+123 Qualified</text>

  <!-- Horizontal Grid lines -->
  <line x1='35' y1='100' x2='565' y2='100' stroke='#f1f5f9' stroke-width='1.5' stroke-dasharray='4 4'/>
  <text x='25' y='104' font-family='Outfit, sans-serif' font-size='10' fill='#94a3b8' text-anchor='end'>40</text>

  <line x1='35' y1='150' x2='565' y2='150' stroke='#f1f5f9' stroke-width='1.5' stroke-dasharray='4 4'/>
  <text x='25' y='154' font-family='Outfit, sans-serif' font-size='10' fill='#94a3b8' text-anchor='end'>25</text>

  <line x1='35' y1='200' x2='565' y2='200' stroke='#f1f5f9' stroke-width='1.5' stroke-dasharray='4 4'/>
  <text x='25' y='204' font-family='Outfit, sans-serif' font-size='10' fill='#94a3b8' text-anchor='end'>10</text>

  <line x1='35' y1='250' x2='565' y2='250' stroke='#e2e8f0' stroke-width='1.5'/>

  <!-- Area Fill -->
  <path d='M65,240 C140,230 190,195 240,165 C310,125 380,105 450,85 C490,75 515,68 540,65 L540,250 L65,250 Z' fill='url(#roofGrad)'/>

  <!-- Growth Line -->
  <path d='M65,240 C140,230 190,195 240,165 C310,125 380,105 450,85 C490,75 515,68 540,65' fill='none' stroke='url(#roofLine)' stroke-width='4' stroke-linecap='round' filter='url(#roofGlow)'/>

  <!-- Data Nodes -->
  <circle cx='65' cy='240' r='5' fill='#ffffff' stroke='#059669' stroke-width='3'/>
  <circle cx='240' cy='165' r='5' fill='#ffffff' stroke='#059669' stroke-width='3'/>
  <circle cx='450' cy='85' r='6' fill='#ffffff' stroke='#10b981' stroke-width='3'/>
  
  <!-- Active Node Glow -->
  <circle cx='540' cy='65' r='7' fill='#10b981' stroke='#ffffff' stroke-width='3'/>
  <circle cx='540' cy='65' r='14' fill='none' stroke='#10b981' stroke-width='1.5' opacity='0.7'/>

  <!-- Month Labels -->
  <text x='65' y='275' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='600' fill='#64748b' text-anchor='middle'>Month 1 (7)</text>
  <text x='240' y='275' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='600' fill='#64748b' text-anchor='middle'>Month 2 (24)</text>
  <text x='450' y='275' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='600' fill='#64748b' text-anchor='middle'>Month 3 (38)</text>
  <text x='540' y='275' font-family='Plus Jakarta Sans, sans-serif' font-size='11' font-weight='800' fill='#015112' text-anchor='middle'>Month 4 (54)</text>
</svg>